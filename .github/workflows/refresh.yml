name: تحديث البيانات تلقائياً

on:
  schedule:
    - cron: "0 */12 * * *"      # كل 12 ساعة
  workflow_dispatch:
    inputs:
      force_keywords:
        description: "أعد جمع كلمات البحث الآن (1 = نعم)"
        required: false
        default: "0"
      window_hours:
        description: "النافذة الزمنية بالساعات (24 / 48 / 72 / 168 / 720)"
        required: false
        default: "48"
      focus:
        description: "التركيز (x = X فقط، all = كل المصادر)"
        required: false
        default: "x"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _app/requirements.txt

      - name: تثبيت الاعتماديات
        run: pip install -r _app/requirements.txt

      - name: صيد العملاء + بناء الموقع
        working-directory: _app
        env:
          SITE_OUT: ${{ github.workspace }}
          FORCE_KEYWORDS: ${{ github.event.inputs.force_keywords || '0' }}
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '48' }}
          FOCUS: ${{ github.event.inputs.focus || 'x' }}
          MIN_LEADS: "18"
        run: python refresh_data.py

      - name: حفظ التغييرات
        run: |
          git config user.name "abunawaf-bot"
          git config user.email "abunawaf-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "لا تغييرات جديدة"
          else
            git commit -m "تحديث تلقائي للبيانات — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: ملخص
        run: |
          echo "### ✅ تم التحديث" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("data/overview.json"))
          print(f"- عملاء مؤهلون: **{d['leads']['total']}** (ساخن: {d['leads']['hot']})")
          print(f"- كلمات البحث: **{d['keywords']['total']}**")
          print(f"- درجة الموقع: **{d['site']['scores'].get('overall')}**")
          print(f"- آخر بناء: {d.get('built_at')}")
          PY
